plugins {
    id 'java'
    id 'application'

    id 'org.jreleaser' version '1.19.0'
    id 'com.gradleup.shadow' version '9.0.0'

}

group = 'klikr'
version = '1.0'


repositories {
    mavenCentral()
}

dependencies {
/*
    implementation("dev.langchain4j:langchain4j:1.10.0")
    implementation("dev.langchain4j:langchain4j-core:1.10.0")
    implementation("dev.langchain4j:langchain4j-ollama:1.10.0")
*/
   implementation 'dev.langchain4j:langchain4j:0.36.2'
    implementation 'dev.langchain4j:langchain4j-core:0.36.2'
    implementation 'dev.langchain4j:langchain4j-ollama:0.36.2'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.18.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    implementation 'io.projectreactor:reactor-core:3.5.8'
    implementation 'com.knuddels:jtokkit:1.0.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'org.slf4j:slf4j-api:2.0.16'

}


def main_class_name = 'translator.Translator'

application {
    mainClass = main_class_name
}
// this is required to make System.in block waiting for user to type input
run{
    standardInput = System.in
    classpath = sourceSets.main.runtimeClasspath
}

